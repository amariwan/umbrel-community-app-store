manifestVersion: 1
id: tasiomind-ollama
storage:
  dataRoot: data
name: Ollama (tasiomind)
tagline: Self-host open source AI models like DeepSeek-R1, Llama, and more
category: ai
version: "0.40.0"
port: 11434
description: >-
  Ollama allows you to download and run advanced AI models directly on your own
  hardware. Self-hosting AI models ensures full control over your data and
  protects your privacy.


  ⚠️ Before running a model, make sure your device has enough free RAM to support
  it. Attempting to run a model that exceeds your available memory could cause
  your device to crash or become unresponsive. Always check the model
  requirements before downloading or starting it.


  **Getting Started:**

  Install the tasiomind-anythingllm app from this store (or Open WebUI) and point
  it at Ollama to manage model downloads and chat effortlessly. Other apps on
  umbrelOS can reach Ollama at http://tasiomind-ollama_ollama_1:11434.
backupIgnore:
  - data/*
developer: Ollama
website: https://ollama.com/
submitter: amariwan
submission: https://github.com/amariwan/umbrel-community-app-store
repo: https://github.com/ollama/ollama
support: https://github.com/ollama/ollama/issues
gallery:
  - https://github.com/ollama.png
defaultUsername: ""
defaultPassword: ""
dependencies: []
permissions:
  - GPU
releaseNotes: >-
  Tracks upstream v0.40.0.
  Full release notes: https://github.com/ollama/ollama/releases
path: ""
