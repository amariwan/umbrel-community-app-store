manifestVersion: 1
id: tasiomind-uptime-kuma
storage:
  dataRoot: data
category: networking
name: Uptime Kuma (tasiomind)
version: "2.5.5"
tagline: Self-hosted uptime monitoring tool
description: >-
  Uptime Kuma is a self-hosted monitoring tool like Uptime Robot.


  Features: monitoring uptime for HTTP(s) / TCP / Keyword / Ping / DNS / Push /
  Steam Game Server; fancy reactive UI; notifications via 70+ services
  (Telegram, Discord, Slack, Email, …); 20-second intervals; status pages;
  ping charts; certificate info.
developer: Louis Lam
website: https://uptime.kuma.pet
