manifestVersion: 1
id: tasiomind-n8n
storage:
  dataRoot: data
environment:
  - name: GENERIC_TIMEZONE
    services:
      - server
    note: IANA time zone used by Schedule nodes, such as America/New_York or Europe/London.
  - name: N8N_WEBHOOK_URL
    services:
      - server
    note: Only set this if n8n is already reachable through a public tunnel or reverse proxy. Enter the complete HTTPS base URL, such as https://n8n.example.com/. This setting does not expose n8n by itself.
category: automation
name: n8n (tasiomind)
version: "2.42.4"
releaseNotes: >-
  Tracks upstream n8n 2.42.4 (see https://github.com/n8n-io/n8n/releases).
  If updating from n8n 2.27.3 or earlier, the database index migration for
  workflow executions introduced in 2.27.4 may take several minutes on large instances.
tagline: Build complex workflows, really fast
description: >-
  n8n is an extendable workflow automation tool with a fair-code distribution
  model: visible source code, self-hostable, with custom functions, logic and apps.


  n8n's node-based approach connects anything to everything — any app with an API
  to any other, with little or no code. Customizable, privacy-focused, self-hosted.
developer: n8n
website: https://n8n.io
dependencies: []
repo: https://github.com/n8n-io/n8n
support: https://docs.n8n.io/
port: 5678
gallery:
  - https://raw.githubusercontent.com/n8n-io/n8n/master/assets/n8n-logo.png
path: ""
defaultUsername: ""
defaultPassword: ""
submitter: amariwan
submission: https://github.com/amariwan/umbrel-community-app-store
